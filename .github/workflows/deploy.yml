# 每次推送到 main（包括在 GitHub 网页上上传文字稿），自动构建并发布到 GitHub Pages。
name: 发布网站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整提交历史：没写日期的文字稿用「第一次上传的时间」当发布日期。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # 构建时要从 Google 下载字体，偶尔会临时失败，失败后等一会儿自动重试，最多 3 次。
      - run: npx next build || (sleep 30 && npx next build) || (sleep 60 && npx next build)
        env:
          # 用 用户名.github.io/仓库名 访问时是 /仓库名；绑定自定义域名后自动变成空。
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
